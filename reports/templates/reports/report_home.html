{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <h3 class="mb-4 text-success">Reports Center</h3>

    <div class="row">

        <div class="col-md-6 mb-4">
            <div class="card shadow border-0 h-100 scroll-reveal">
                <div class="card-body">
                    <h5 class="text-success">Invoice Reports</h5>
                    <p class="text-muted">Download invoice data as Excel or PDF.</p>

                    <a href="{% url 'invoice_excel' %}" class="btn btn-success me-2">
                        Download Excel
                    </a>

                    <a href="{% url 'invoice_pdf' %}" class="btn btn-danger">
                        Download PDF
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow border-0 h-100 scroll-reveal">
                <div class="card-body">
                    <h5 class="text-primary">Attendance Reports</h5>
                    <p class="text-muted">Download attendance records as Excel or PDF.</p>

                    <a href="{% url 'attendance_excel' %}" class="btn btn-primary me-2">
                        Download Excel
                    </a>

                    <a href="{% url 'attendance_pdf' %}" class="btn btn-danger">
                        Download PDF
                    </a>
                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}
